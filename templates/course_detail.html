{% extends 'base.html' %}
{% block title %}{{course.title}}- LMS{% endblock %}
{% block content %}
<h1>Course Details</h1>
<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>{{course.id}}</th>
    </tr>
    <tr>
        <th>title</th>
        <th>{{course.title}}</th>

    </tr>
    <tr>
        <th>Description</th>
        <th>{{course.description or '-'}}</th>
    </tr>
    <tr>
        <th>Teacher ID</th>
        <th>{{course.teacher_id}}</th>
    </tr>
</table>

<p>
    <a href="{{url_for('list_courses')}}">Back to course List</a> |
    <a href="{{url_for('course_edit',id=course.id)}}">Edit course</a> |
    <a href="{{url_for('course_delete',id=course.id)}}"
        onclick="return confirm('are you sure you want to delete this course?')">Delete course</a>
</p>
{% endblock %}
