{% extends 'base.html' %}
{% block title %}{{user.username}}- LMS{% endblock %}
{% block content %}
<h1>User Details</h1>
<table border="1" cellpadding="8">
    <tr>
        <th>ID</th>
        <th>{{user.id}}</th>
    </tr>
    <tr>
        <th>Username</th>
        <th>{{user.username}}</th>

    </tr>
    <tr>
        <th>Email</th>
        <th>{{user.email}}</th>
    </tr>
    <tr>
        <th>Role</th>
        <th>{{user.roles}}</th>
    </tr>
</table>

<p>
    <a href="{{url_for('list_users')}}">Back to Users List</a> |
    <a href="{{url_for('edit_user',id=user.id)}}">Edit User</a> |
    <a href="{{url_for('delete_user',id=user.id)}}"
        onclick="return confirm('are you sure you want to delete this user?')">Delete</a>
</p>
{% endblock %}
